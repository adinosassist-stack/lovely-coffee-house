name: Diagnose live Workers AI runtime

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose-live-ai:
    if: contains(github.event.head_commit.message, '[diag-live-ai]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PROJECT: lovelycoffeehouse
      WRANGLER_VERSION: 4.131.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare production config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes "wrangler@${WRANGLER_VERSION}" pages download config "$CLOUDFLARE_PROJECT" --force
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('wrangler.toml')
          t=p.read_text()
          line='pages_build_output_dir = "./site"'
          t=re.sub(r'^[ \t]*pages_build_output_dir[ \t]*=.*$',line,t,flags=re.M) if re.search(r'^[ \t]*pages_build_output_dir[ \t]*=.*$',t,flags=re.M) else line+'\n'+t
          if not re.search(r'^\[ai\][ \t]*$',t,flags=re.M):
              t=t.rstrip()+'\n\n[ai]\nbinding = "AI"\n'
          p.write_text(t)
          PY
          grep -q '^\[env\.production\.ai\]$' wrangler.toml
          grep -q '^\[ai\]$' wrangler.toml

      - name: Patch temporary status diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cp site/_worker.js "$RUNNER_TEMP/original-worker.js"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/_worker.js')
          t=p.read_text()
          old="""async function handleStatus({ env }) {
  const ai = await probeAi(env);
  return apiJson({ ai });
}"""
          new="""async function handleStatus({ env }) {
  const binding = Boolean(env?.AI && typeof env.AI.run === 'function');
  if (!binding) return apiJson({ ai:false, binding:false, reason:'binding_missing' });
  try {
    const result = await env.AI.run('@cf/meta/llama-3.1-8b-instruct-fast', {
      messages: [{ role:'user', content:'Reply OK.' }],
      max_tokens: 2,
      temperature: 0,
    });
    return apiJson({ ai:Boolean(result), binding:true, reason:result ? 'ok' : 'empty_result' });
  } catch (error) {
    const rawCode = error?.code ?? error?.cause?.code ?? error?.status ?? error?.cause?.status ?? '';
    const rawMessage = String(error?.message || error?.cause?.message || error?.name || 'runtime_error');
    return apiJson({
      ai:false,
      binding:true,
      reason:'runtime_error',
      code:String(rawCode).slice(0,40),
      message:rawMessage.replace(/[\\r\\n]+/g,' ').slice(0,220),
    });
  }
}"""
          if old not in t:
              raise SystemExit('handleStatus target not found')
          p.write_text(t.replace(old,new,1))
          PY
          node --check site/_worker.js

      - name: Deploy temporary diagnostic worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Temporary live AI diagnostic $GITHUB_SHA"

      - name: Read diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..15}; do
            body="$(curl -fsS 'https://lovelycoffeehouse.com/api/lovely-status' 2>/dev/null || true)"
            echo "diagnostic_attempt=$i body=$body"
            if BODY="$body" node -e "const p=JSON.parse(process.env.BODY||'{}');process.exit(Object.prototype.hasOwnProperty.call(p,'binding')?0:1)" 2>/dev/null; then exit 0; fi
            sleep 2
          done
          echo '::error::Diagnostic status response did not propagate'
          exit 1

      - name: Restore sealed worker and redeploy
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/original-worker.js"
          cp "$RUNNER_TEMP/original-worker.js" site/_worker.js
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Restore sealed worker after live AI diagnostic $GITHUB_SHA"
