name: Verify sealed R19 source

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovely-coffee-house-r19-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify exact sealed R19 source
        shell: bash
        run: |
          set -euo pipefail
          test -d site
          test -f release/r19-site.sha256
          test ! -e bootstrap
          test "$(wc -l < release/r19-site.sha256)" -eq 50
          test "$(find site -type f | wc -l)" -eq 50
          (cd site && sha256sum -c ../release/r19-site.sha256)
          node --check site/_worker.js
          find site/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          grep -q "response_format: { type: 'json_object' }" site/_worker.js
          ! grep -q "type: 'json_schema'" site/_worker.js
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json', 'utf8'));
          const expected = 'lovely-live-source-r19-json-object-planner-20260912-r19';
          if (info.build !== expected) {
            console.error(`Unexpected build: ${info.build}`);
            process.exit(1);
          }
          if (info.ai_binding !== 'AI') {
            console.error(`Unexpected AI binding: ${info.ai_binding}`);
            process.exit(1);
          }
          console.log(`Verified ${info.build}`);
          NODE
