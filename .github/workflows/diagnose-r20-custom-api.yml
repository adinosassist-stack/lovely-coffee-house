name: Diagnose R20 custom-domain API

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diag-r20-custom]')
    runs-on: ubuntu-latest
    steps:
      - name: Probe custom-domain API variants
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local name="$1"; shift
            local body="$RUNNER_TEMP/${name}.body"
            local hdr="$RUNNER_TEMP/${name}.hdr"
            local code
            code="$(curl -sS -D "$hdr" -o "$body" -w '%{http_code}' "$@" 'https://lovelycoffeehouse.com/api/lovely-status' || true)"
            echo "=== $name HTTP $code ==="
            grep -Ei '^(HTTP/|location:|server:|cf-|x-lovely-build:|content-type:)' "$hdr" || true
            echo 'BODY:'
            cat "$body" || true
            echo
          }
          probe bare
          probe origin -H 'Origin: https://lovelycoffeehouse.com'
          probe fetchsite -H 'Origin: https://lovelycoffeehouse.com' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Mode: cors'
          probe browser -H 'Origin: https://lovelycoffeehouse.com' -H 'Sec-Fetch-Site: same-origin' -H 'Sec-Fetch-Mode: cors' -H 'User-Agent: Mozilla/5.0'
