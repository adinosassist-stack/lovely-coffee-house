name: Generate committed AI runtime diagnostic

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate-ai-runtime-diagnostic:
    if: contains(github.event.head_commit.message, '[gen-ai-runtime-diag]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Patch status endpoint with sanitized direct AI probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/_worker.js')
          t=p.read_text()
          old="const M_worker_routes_status = (() => {\nconst { aiBindingReady } = M_worker_lib_ai;\nconst { apiJson } = M_worker_lib_security;\nasync function handleStatus({ env }) {\n  // Status checks must never spend Workers AI neurons. Runtime health is verified\n  // by an actual planner request in the production gate instead.\n  return apiJson({ ai: aiBindingReady(env), runtime: 'unchecked' });\n}\nreturn { handleStatus };\n})();"
          new="const M_worker_routes_status = (() => {\nconst { aiBindingReady } = M_worker_lib_ai;\nconst { apiJson } = M_worker_lib_security;\nasync function handleStatus({ env }) {\n  const binding = aiBindingReady(env);\n  if (!binding) return apiJson({ ai:false, binding:false, runtime:'binding_missing' });\n  try {\n    const result = await env.AI.run('@cf/meta/llama-3.1-8b-instruct-fast', { messages:[{ role:'user', content:'Reply OK.' }], max_tokens:8, temperature:0 });\n    return apiJson({ ai:Boolean(result), binding:true, runtime:'ok', resultKeys:result && typeof result === 'object' ? Object.keys(result).slice(0,12) : [] });\n  } catch (error) {\n    const cause = error && error.cause ? error.cause : null;\n    const code = error && (error.code ?? error.status) != null ? (error.code ?? error.status) : (cause && (cause.code ?? cause.status) != null ? (cause.code ?? cause.status) : '');\n    const name = String((error && error.name) || '').slice(0,60);\n    const message = String((error && error.message) || (cause && cause.message) || 'runtime_error').replace(/[\\r\\n]+/g,' ').slice(0,300);\n    const causeMessage = String((cause && cause.message) || '').replace(/[\\r\\n]+/g,' ').slice(0,240);\n    return apiJson({ ai:false, binding:true, runtime:'error', code:String(code).slice(0,60), name, message, causeMessage });\n  }\n}\nreturn { handleStatus };\n})();"
          if old not in t:
              raise SystemExit('quota-safe status module target not found')
          p.write_text(t.replace(old,new,1))
          PY
          node --check site/_worker.js

      - name: Reseal R20 source
        shell: bash
        run: |
          set -euo pipefail
          hash="$(sha256sum site/_worker.js | awk '{print $1}')"
          python3 - "$hash" <<'PY'
          from pathlib import Path
          import re,sys
          h=sys.argv[1]
          p=Path('release/r20-site.sha256')
          t=p.read_text()
          n=re.sub(r'^[0-9a-f]{64}  _worker\.js$', f'{h}  _worker.js', t, count=1, flags=re.M)
          if n == t:
              raise SystemExit('worker seal target not found')
          p.write_text(n)
          PY
          test "$(wc -l < release/r20-site.sha256)" -eq 50
          test "$(find site -type f | wc -l)" -eq 50
          (cd site && sha256sum -c ../release/r20-site.sha256)

      - name: Push diagnostic source branch
        shell: bash
        run: |
          set -euo pipefail
          branch='chatgpt/committed-ai-runtime-diag-r20-20260913'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add site/_worker.js release/r20-site.sha256
          git commit -m 'Temporarily expose sanitized Workers AI runtime error'
          git push origin "$branch"
          echo "Created $branch"
