name: Check Workers AI quota recovery

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-ai-runtime:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[diag-ai-unique]')
    runs-on: ubuntu-latest
    steps:
      - name: Probe production concierge runtime without deployment
        shell: bash
        run: |
          set -euo pipefail
          client="githubdiag${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          body='{"question":"What is the price of a cappuccino?","history":[],"context":"coffee","mode":"text","state":{"order":[],"orderTotal":0,"fulfilment":null,"lastProduct":null,"flow":null,"flowStep":null,"hydrationReminder":null}}'
          out="$RUNNER_TEMP/ai-runtime.json"
          code="$(curl -sS -o "$out" -w '%{http_code}' \
            -H 'Origin: https://lovelycoffeehouse.com' \
            -H 'Content-Type: application/json' \
            -H "X-Lovely-Client: $client" \
            --data "$body" \
            'https://lovelycoffeehouse.com/api/lovely-ai' || true)"
          response="$(cat "$out" 2>/dev/null || true)"
          echo "runtime_http=$code response=$response"
          if [ "$code" = 200 ] && RESPONSE="$response" node -e "const p=JSON.parse(process.env.RESPONSE||'{}'); process.exit(typeof p.answer==='string'&&p.answer.length>0?0:1)" 2>/dev/null; then
            echo 'Workers AI runtime is available.'
            exit 0
          fi
          if [ "$code" = 503 ] && RESPONSE="$response" node -e "const p=JSON.parse(process.env.RESPONSE||'{}'); process.exit(p.error==='ai_unavailable'?0:1)" 2>/dev/null; then
            echo '::error::Workers AI runtime is still unavailable or quota-limited.'
            exit 1
          fi
          echo "::error::Unexpected Workers AI probe result: HTTP $code"
          exit 1
