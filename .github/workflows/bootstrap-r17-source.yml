name: Bootstrap exact R17 source

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - bootstrap/r17-github-deploy-20260912
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lovely-coffee-house-r17-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mirror-and-seal:
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[source-mirror]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Reconstruct sealed R17 private and challenge-blocked files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .bootstrap-out

          cat bootstrap/worker.js.gz.b64.part{1..5} | base64 --decode > .bootstrap-out/worker.js.gz
          gzip -dc .bootstrap-out/worker.js.gz > .bootstrap-out/_worker.js
          printf '%s  %s\n' '7285703d897536ead62b8c6ab2a690de4e063c43635b175654c4dcc236a25355' '.bootstrap-out/_worker.js' | sha256sum -c -
          node --check .bootstrap-out/_worker.js
          printf '%s  %s\n' '58a2719a50dd0c56847e08046349e31c67329eab13b68976cc31206e72c161d9' 'bootstrap/_headers' | sha256sum -c -

          cat bootstrap/challenge-blocked-r17.tar.gz.b64.part{1..3} | base64 --decode > .bootstrap-out/challenge-blocked-r17.tar.gz
          printf '%s  %s\n' '92998724da0c50759df0b73ccaf0758956df85f84400fbe348722dbbd6da15eb' '.bootstrap-out/challenge-blocked-r17.tar.gz' | sha256sum -c -
          tar -tzf .bootstrap-out/challenge-blocked-r17.tar.gz | sort > .bootstrap-out/challenge-blocked-files.txt
          cat > .bootstrap-out/expected-challenge-blocked-files.txt <<'EOF'
          404.html
          build-info.json
          index.html
          manifest.webmanifest
          privacy/index.html
          rooms/index.html
          site.webmanifest
          sitemap.xml
          EOF
          diff -u .bootstrap-out/expected-challenge-blocked-files.txt .bootstrap-out/challenge-blocked-files.txt

      - name: Mirror exact R17 public assets and assemble sealed source
        shell: bash
        env:
          ORIGIN: https://lovelycoffeehouse.com
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site
          while read -r digest path; do
            case "$path" in
              _worker.js|_headers|404.html|build-info.json|index.html|manifest.webmanifest|privacy/index.html|rooms/index.html|site.webmanifest|sitemap.xml)
                continue
                ;;
            esac
            mkdir -p "site/$(dirname "$path")"
            curl --location --silent --show-error --fail --retry 4 --retry-delay 2 --retry-all-errors \
              --connect-timeout 15 --max-time 90 \
              -o "site/$path" "$ORIGIN/$path"
          done < release/r17-site.sha256

          cp .bootstrap-out/_worker.js site/_worker.js
          cp bootstrap/_headers site/_headers
          tar -xzf .bootstrap-out/challenge-blocked-r17.tar.gz -C site

      - name: Verify exact sealed R17 bytes
        shell: bash
        run: |
          set -euo pipefail
          (cd site && sha256sum -c ../release/r17-site.sha256)
          test "$(find site -type f | wc -l)" -eq 50
          node --check site/_worker.js
          find site/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json', 'utf8'));
          const expected = 'lovely-live-source-r17-structured-action-planner-20260911-r17';
          if (info.build !== expected) {
            console.error(`Unexpected build: ${info.build}`);
            process.exit(1);
          }
          console.log(`Verified ${info.build}`);
          NODE

      - name: Commit exact R17 source
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap .bootstrap-out
          git add -A site bootstrap
          if git diff --cached --quiet; then
            echo 'Exact R17 source is already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bootstrap exact verified R17 production source [source-mirror]'
          git push origin "HEAD:${GITHUB_REF_NAME}"
