name: Diagnose Pages AI binding

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[diag-ai-binding]')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Pages Workers AI binding state
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          acct="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          api='https://api.cloudflare.com/client/v4'
          project="$RUNNER_TEMP/project.json"
          code="$(curl -sS -o "$project" -w '%{http_code}' -H "Authorization: Bearer $token" "$api/accounts/$acct/pages/projects/lovelycoffeehouse")"
          echo "project_http=$code"
          PROJECT="$(cat "$project")" node - <<'NODE'
          const p=JSON.parse(process.env.PROJECT||'{}');
          console.log('success='+(p.success===true));
          const r=p.result||{};
          for(const envName of ['production','preview']){
            const cfg=r.deployment_configs?.[envName]||{};
            const ai=cfg.ai_bindings||{};
            console.log(`${envName}_ai_binding_names=${Object.keys(ai).join(',')||'none'}`);
            for(const [name,v] of Object.entries(ai)) console.log(`${envName}_ai_${name}_value=${JSON.stringify(v||{})}`);
            console.log(`${envName}_compatibility_date=${cfg.compatibility_date||'none'}`);
          }
          console.log('latest_deployment_id='+(r.latest_deployment?.id||'none'));
          console.log('latest_deployment_environment='+(r.latest_deployment?.environment||'none'));
          NODE

      - name: Test Workers AI account runtime directly
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          token="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          acct="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          api='https://api.cloudflare.com/client/v4'
          out="$RUNNER_TEMP/ai-direct.json"
          code="$(curl -sS -o "$out" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/json' \
            --data '{"messages":[{"role":"user","content":"Reply OK."}],"max_tokens":2,"temperature":0}' \
            "$api/accounts/$acct/ai/run/@cf/meta/llama-3.1-8b-instruct-fast")"
          echo "direct_ai_http=$code"
          AI_RESULT="$(cat "$out")" node - <<'NODE'
          const p=JSON.parse(process.env.AI_RESULT||'{}');
          console.log('direct_ai_success='+(p.success===true));
          for(const e of p.errors||[]) console.log(`direct_ai_error=${e.code||'unknown'}:${e.message||'unknown'}`);
          const result=p.result;
          if(result && typeof result==='object') console.log('direct_ai_result_keys='+Object.keys(result).join(','));
          NODE

      - name: Inspect live custom-domain AI status
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/status.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' 'https://lovelycoffeehouse.com/api/lovely-status')"
          echo "custom_status_http=$code"
          STATUS="$(cat "$body")" node - <<'NODE'
          let p={};try{p=JSON.parse(process.env.STATUS||'{}')}catch(_){}
          console.log('custom_status_ai='+(p.ai===true));
          console.log('custom_status_keys='+Object.keys(p).join(','));
          NODE

      - name: Test live structured planner independently of status probe
        shell: bash
        run: |
          set -euo pipefail
          body='{"question":"add one cappuccino","history":[],"context":"coffee","mode":"text","state":{"order":[],"orderTotal":0,"fulfilment":null,"lastProduct":null,"flow":null,"flowStep":null,"hydrationReminder":null}}'
          out="$RUNNER_TEMP/planner.json"
          code="$(curl -sS -o "$out" -w '%{http_code}' \
            -H 'Origin: https://lovelycoffeehouse.com' \
            -H 'Content-Type: application/json' \
            -H 'X-Lovely-Client: githubdiagplanner1' \
            --data "$body" 'https://lovelycoffeehouse.com/api/lovely-actions')"
          echo "planner_http=$code"
          PLANNER="$(cat "$out")" node - <<'NODE'
          let p={};try{p=JSON.parse(process.env.PLANNER||'{}')}catch(_){}
          console.log('planner_handled='+(p.handled===true));
          console.log('planner_first_action='+(p.actions?.[0]?.type||'none'));
          console.log('planner_error='+(p.error||'none'));
          NODE

      - name: Inspect downloaded Wrangler AI sections
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes wrangler@4.131.0 pages download config lovelycoffeehouse --force >/dev/null
          echo '--- wrangler AI sections ---'
          grep -n -A3 -B1 -E '^\[.*ai.*\]$|^ai\s*=|binding\s*=\s*"AI"' wrangler.toml || true
