name: Probe live Workers AI error

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  probe-ai-error:
    if: contains(github.event.head_commit.message, '[probe-ai-error]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PROJECT: lovelycoffeehouse
      WRANGLER_VERSION: 4.131.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare production Pages config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes "wrangler@${WRANGLER_VERSION}" pages download config "$CLOUDFLARE_PROJECT" --force
          printf '\n[ai]\nbinding = "AI"\n' >> wrangler.toml
          grep -q '^\[env\.production\.ai\]$' wrangler.toml
          grep -q '^\[ai\]$' wrangler.toml

      - name: Patch status endpoint to expose sanitized AI runtime error
        shell: bash
        run: |
          set -euo pipefail
          cp site/_worker.js "$RUNNER_TEMP/original-worker.js"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('site/_worker.js')
          t=p.read_text()
          old="""async function handleStatus({ env }) {
  const ai = await probeAi(env);
  return apiJson({ ai });
}"""
          new="""async function handleStatus({ env }) {
  const binding = Boolean(env && env.AI && typeof env.AI.run === 'function');
  if (!binding) return apiJson({ ai:false, binding:false, reason:'binding_missing' });
  try {
    const result = await env.AI.run('@cf/meta/llama-3.1-8b-instruct-fast', {
      messages: [{ role:'user', content:'Reply OK.' }],
      max_tokens: 2,
      temperature: 0,
    });
    return apiJson({ ai:Boolean(result), binding:true, reason:result ? 'ok' : 'empty_result' });
  } catch (error) {
    const code = String((error && (error.code || error.status)) || '').slice(0,40);
    const message = String((error && error.message) || (error && error.name) || 'runtime_error').replace(/[\\r\\n]+/g,' ').slice(0,220);
    return apiJson({ ai:false, binding:true, reason:'runtime_error', code, message });
  }
}"""
          if old not in t:
              raise SystemExit('handleStatus target not found')
          p.write_text(t.replace(old,new,1))
          PY
          node --check site/_worker.js

      - name: Deploy diagnostic status endpoint to production branch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Live AI error probe $GITHUB_SHA"

      - name: Read sanitized live AI error
        shell: bash
        run: |
          set -euo pipefail
          found=false
          for i in {1..20}; do
            body="$(curl -fsS 'https://lovelycoffeehouse.com/api/lovely-status' 2>/dev/null || true)"
            echo "attempt=$i status=$body"
            if BODY="$body" node -e "const p=JSON.parse(process.env.BODY||'{}');process.exit(Object.prototype.hasOwnProperty.call(p,'binding')?0:1)" 2>/dev/null; then
              found=true
              break
            fi
            sleep 2
          done
          echo "diagnostic_seen=$found"

      - name: Restore sealed production worker
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/original-worker.js" site/_worker.js
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="Restore sealed worker after live AI error probe $GITHUB_SHA"
