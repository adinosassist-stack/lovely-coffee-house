name: Apply Workers AI quota hardening

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  quota-hardening:
    if: contains(github.event.head_commit.message, '[quota-hardening]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Patch status probe and production config handling
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('site/_worker.js')
          t = worker.read_text()
          old = "const M_worker_routes_status = (() => {\nconst { probeAi } = M_worker_lib_ai;\nconst { apiJson } = M_worker_lib_security;\nasync function handleStatus({ env }) {\n  const ai = await probeAi(env);\n  return apiJson({ ai });\n}\nreturn { handleStatus };\n})();"
          new = "const M_worker_routes_status = (() => {\nconst { aiBindingReady } = M_worker_lib_ai;\nconst { apiJson } = M_worker_lib_security;\nasync function handleStatus({ env }) {\n  // Status checks must never spend Workers AI neurons. Runtime health is verified\n  // by an actual planner request in the production gate instead.\n  return apiJson({ ai: aiBindingReady(env), runtime: 'unchecked' });\n}\nreturn { handleStatus };\n})();"
          if old not in t:
              raise SystemExit('status module target not found')
          worker.write_text(t.replace(old, new, 1))

          deploy = Path('.github/workflows/deploy-production.yml')
          d = deploy.read_text()
          replacements = {
              "r'^\\s*pages_build_output_dir\\s*=.*$'": "r'^[ \\t]*pages_build_output_dir[ \\t]*=.*$'",
              "rf'^\\s*\\[{re.escape(table)}\\]\\s*$'": "rf'^[ \\t]*\\[{re.escape(table)}\\][ \\t]*$'",
              "r'^\\s*\\[[^\\]]+\\]\\s*$'": "r'^[ \\t]*\\[[^\\]]+\\][ \\t]*$'",
              "r'^\\s*binding\\s*=.*$'": "r'^[ \\t]*binding[ \\t]*=.*$'",
              "r'^\\s*\\[env\\.production\\]\\s*$'": "r'^[ \\t]*\\[env\\.production\\][ \\t]*$'",
          }
          for a, b in replacements.items():
              if a not in d:
                  raise SystemExit('deploy regex target not found: ' + a)
              d = d.replace(a, b)
          deploy.write_text(d)
          PY

          node --check site/_worker.js
          grep -q "runtime: 'unchecked'" site/_worker.js
          grep -q "aiBindingReady(env)" site/_worker.js

      - name: Reseal R20 worker
        shell: bash
        run: |
          set -euo pipefail
          hash="$(sha256sum site/_worker.js | awk '{print $1}')"
          python3 - "$hash" <<'PY'
          from pathlib import Path
          import sys,re
          h=sys.argv[1]
          p=Path('release/r20-site.sha256')
          t=p.read_text()
          n=re.sub(r'^[0-9a-f]{64}  _worker\.js$', f'{h}  _worker.js', t, count=1, flags=re.M)
          if n == t:
              raise SystemExit('worker seal target not found')
          p.write_text(n)
          PY
          (cd site && sha256sum -c ../release/r20-site.sha256)

      - name: Create quota-hardening branch
        shell: bash
        run: |
          set -euo pipefail
          branch='chatgpt/quota-hardening-r20-20260912'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git add site/_worker.js release/r20-site.sha256 .github/workflows/deploy-production.yml
          git commit -m 'Reduce Workers AI quota waste and harden production config'
          git push --force-with-lease origin "$branch"
          echo "Created $branch"
