name: Force Pages AI production deploy

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  force-production-ai:
    if: contains(github.event.head_commit.message, '[force-ai-prod]')
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_PROJECT: lovelycoffeehouse
      WRANGLER_VERSION: 4.131.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Prepare explicit production AI binding config
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes "wrangler@${WRANGLER_VERSION}" pages download config "$CLOUDFLARE_PROJECT" --force
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('wrangler.toml')
          t=p.read_text()
          line='pages_build_output_dir = "./site"'
          t=re.sub(r'^\s*pages_build_output_dir\s*=.*$',line,t,flags=re.M) if re.search(r'^\s*pages_build_output_dir\s*=.*$',t,flags=re.M) else line+'\n'+t
          def ensure_table(text,table):
              pat=rf'^\s*\[{re.escape(table)}\]\s*$'
              if not re.search(pat,text,flags=re.M):
                  return text.rstrip()+f'\n\n[{table}]\nbinding = "AI"\n'
              m=re.search(pat,text,flags=re.M); start=m.end()
              n=re.search(r'^\s*\[[^\]]+\]\s*$',text[start:],flags=re.M); end=start+n.start() if n else len(text)
              body=text[start:end]
              if re.search(r'^\s*binding\s*=.*$',body,flags=re.M):
                  body=re.sub(r'^\s*binding\s*=.*$','binding = "AI"',body,count=1,flags=re.M)
              else:
                  body='\nbinding = "AI"'+body
              return text[:start]+body+text[end:]
          t=ensure_table(t,'ai')
          t=ensure_table(t,'env.production.ai')
          p.write_text(t)
          PY
          echo '--- effective AI config ---'
          grep -n -A3 -B1 -E '^\[ai\]$|^\[env\.production\.ai\]$|binding\s*=\s*"AI"' wrangler.toml

      - name: Deploy explicitly as production main branch
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site \
            --project-name="$CLOUDFLARE_PROJECT" \
            --branch=main \
            --env=production \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="Explicit production AI binding $GITHUB_SHA" \
            2>&1 | tee "$RUNNER_TEMP/deploy.log"

      - name: Verify live AI and planner
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..20}; do
            status="$(curl -fsS 'https://lovelycoffeehouse.com/api/lovely-status' 2>/dev/null || true)"
            echo "attempt=$i status=$status"
            if STATUS="$status" node -e "const p=JSON.parse(process.env.STATUS||'{}');process.exit(p.ai===true?0:1)" 2>/dev/null; then
              body='{"question":"add one cappuccino","history":[],"context":"coffee","mode":"text","state":{"order":[],"orderTotal":0,"fulfilment":null,"lastProduct":null,"flow":null,"flowStep":null,"hydrationReminder":null}}'
              out="$(curl -fsS -H 'Origin: https://lovelycoffeehouse.com' -H 'Content-Type: application/json' -H 'X-Lovely-Client: githubforceaiprod1' --data "$body" 'https://lovelycoffeehouse.com/api/lovely-actions' 2>/dev/null || true)"
              echo "planner=$out"
              OUT="$out" node -e "const p=JSON.parse(process.env.OUT||'{}');process.exit(p.handled===true&&p.actions?.[0]?.type==='ADD_ITEM'?0:1)"
              exit 0
            fi
            sleep 3
          done
          echo '::error::Production AI did not recover after explicit production deployment'
          exit 1
