name: Stage sealed R20 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stage-r20:
    if: contains(github.event.head_commit.message, '[stage-r20]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build, verify and stage R20 runtime
        shell: bash
        env:
          RELEASE_BRANCH: release/r20-header-consistency-20260912
        run: |
          set -euo pipefail
          git checkout -B "$RELEASE_BRANCH" origin/main

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          old_build = 'lovely-live-source-r19-json-object-planner-20260912-r19'
          new_build = 'lovely-live-source-r20-header-consistency-20260912-r20'

          worker_path = Path('site/_worker.js')
          worker = worker_path.read_text()
          assert worker.count(old_build) == 1, 'unexpected R19 build-id count'
          worker = worker.replace(old_build, new_build, 1)
          worker = worker.replace('// Lovely Coffee House R19 - deployment-safe single-file Cloudflare Pages Worker',
                                  '// Lovely Coffee House R20 - deployment-safe single-file Cloudflare Pages Worker', 1)
          assert "response_format: { type: 'json_object' }" in worker, 'R19 planner compatibility fix missing'
          assert "type: 'json_schema'" not in worker, 'strict JSON schema unexpectedly restored'
          worker_path.write_text(worker)

          headers_path = Path('site/_headers')
          headers = headers_path.read_text()
          headers, count = re.subn(r'^\s*X-Lovely-Build:\s*.*$', f'  X-Lovely-Build: {new_build}', headers, count=1, flags=re.M)
          assert count == 1, 'expected exactly one X-Lovely-Build header marker'
          assert old_build not in headers
          assert 'lovely-live-source-r17-structured-action-planner-20260911-r17' not in headers
          headers_path.write_text(headers)

          info_path = Path('site/build-info.json')
          info = json.loads(info_path.read_text())
          assert info.get('build') == old_build
          info['build'] = new_build
          info['source'] = 'Lovely Coffee House R19 + R20 release-header consistency hardening; JSON-object planner and deterministic commerce validation preserved'
          info['sw_version'] = '2026-09-12-r20-header-consistency'
          info['artifact'] = 'release/r20-site.sha256'
          info_path.write_text(json.dumps(info, indent=2, ensure_ascii=False) + '\n')

          sw_path = Path('site/sw.js')
          sw = sw_path.read_text()
          for old, new in {
              '2026-09-12-r19-json-object': '2026-09-12-r20-header-consistency',
              'lovely-static-r19-json-object': 'lovely-static-r20-header-consistency',
              'lovely-nav-r19-json-object': 'lovely-nav-r20-header-consistency',
          }.items():
              assert old in sw, f'missing service worker marker {old}'
              sw = sw.replace(old, new, 1)
          sw_path.write_text(sw)

          report = '''Lovely Coffee House R20 — Header Consistency Hardening\n\nBuild: lovely-live-source-r20-header-consistency-20260912-r20\n\nProduction evidence from R19:\n- Exact sealed source verification: PASS\n- Cloudflare exact project qualification: PASS\n- Pages deployment: PASS\n- Workers AI status: READY\n- Structured add-one-cappuccino planner: PASS\n- Custom-domain robots.txt and sw.js R19 hashes: PASS\n- Custom-domain release header check: mismatch\n\nRoot cause found in source:\n- site/_headers still advertised the R17 build ID.\n\nR20 changes:\n- Aligns site/_headers X-Lovely-Build with the R20 Worker/build identity.\n- Preserves R19 JSON Object planner compatibility fix unchanged.\n- Preserves deterministic server-side catalog, grounding, quantity, fulfilment and handoff validation.\n- Bumps build and service-worker cache generation.\n- Retains R19/R18/R17 manifests for rollback.\n'''
          Path('release/R20_HEADER_CONSISTENCY_REPORT.txt').write_text(report)

          Path('README.md').write_text(f'''# Lovely Coffee House\n\nProduction source repository for [lovelycoffeehouse.com](https://lovelycoffeehouse.com).\n\n## Current production candidate\n\n- Release: **R20 — Header Consistency Hardening**\n- Build: `{new_build}`\n- Cloudflare Pages project: `lovelycoffeehouse`\n- Sealed site manifest: `release/r20-site.sha256` (50 files)\n- Rollback manifests retained: R19, R18 and R17\n- Workers AI binding: `AI`\n\nR20 preserves the working R19 JSON Object structured planner and deterministic commerce controls, while aligning the static Pages release header with the active Worker/build identity.\n''')
          PY

          find site -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  site/#  #' > release/r20-site.sha256
          test "$(wc -l < release/r20-site.sha256)" -eq 50
          test "$(find site -type f | wc -l)" -eq 50
          (cd site && sha256sum -c ../release/r20-site.sha256)
          node --check site/_worker.js
          grep -q "response_format: { type: 'json_object' }" site/_worker.js
          ! grep -q "type: 'json_schema'" site/_worker.js
          grep -q 'lovely-live-source-r20-header-consistency-20260912-r20' site/_worker.js
          grep -q 'X-Lovely-Build: lovely-live-source-r20-header-consistency-20260912-r20' site/_headers
          grep -q 'lovely-live-source-r20-header-consistency-20260912-r20' site/build-info.json

          {
            printf 'BUILD_INFO_SHA256=%s\n' "$(sha256sum site/build-info.json | awk '{print $1}')"
            printf 'SW_SHA256=%s\n' "$(sha256sum site/sw.js | awk '{print $1}')"
            printf 'WORKER_SHA256=%s\n' "$(sha256sum site/_worker.js | awk '{print $1}')"
            printf 'HEADERS_SHA256=%s\n' "$(sha256sum site/_headers | awk '{print $1}')"
          } > release/R20_RUNTIME_HASHES.txt

          git config user.name 'adinosassist-stack'
          git config user.email 'adinosassist@gmail.com'
          git add site/_worker.js site/_headers site/build-info.json site/sw.js release/r20-site.sha256 release/R20_HEADER_CONSISTENCY_REPORT.txt release/R20_RUNTIME_HASHES.txt README.md
          git diff --cached --check
          git commit -m 'Stage sealed R20 header consistency runtime'
          git push --force-with-lease origin HEAD:"$RELEASE_BRANCH"
