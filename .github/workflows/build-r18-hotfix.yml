name: Build sealed R18 planner hotfix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-r18:
    if: contains(github.event.head_commit.message, '[build-r18]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build and seal R18
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          old_build = 'lovely-live-source-r17-structured-action-planner-20260911-r17'
          new_build = 'lovely-live-source-r18-planner-json-mode-20260912-r18'

          worker_path = Path('site/_worker.js')
          worker = worker_path.read_text()
          assert worker.count(old_build) == 1, 'unexpected R17 build-id count in worker'
          worker = worker.replace(old_build, new_build, 1)
          worker = worker.replace('// Lovely Coffee House R17 - deployment-safe single-file Cloudflare Pages Worker',
                                  '// Lovely Coffee House R18 - deployment-safe single-file Cloudflare Pages Worker', 1)

          old_planner = """const result = await withTimeout(env.AI.run(AI_MODEL, { messages, max_tokens:420, temperature:0 }), TIMEOUTS.aiMs, 'ai_unavailable');
              const raw = typeof result === 'string' ? result : (result?.response ?? result?.result?.response ?? '');
              return apiJson(normalizePlannerResult(parsePlannerJson(raw), payload.question, payload.state));"""
          new_planner = """const result = await withTimeout(env.AI.run(AI_MODEL, {
              messages,
              max_tokens:420,
              temperature:0,
              response_format: {
                type: 'json_schema',
                json_schema: {
                  type: 'object',
                  properties: {
                    handled: { type: 'boolean' },
                    actions: {
                      type: 'array',
                      items: {
                        type: 'object',
                        properties: {
                          type: { type: 'string', enum: ['ADD_ITEM','REMOVE_ITEM','SET_QUANTITY','SWAP_ITEM','SET_FULFILMENT','CLEAR_ORDER'] },
                          product: { type: 'string' },
                          quantity: { type: 'integer' },
                          fromProduct: { type: 'string' },
                          toProduct: { type: 'string' },
                          fromQuantity: { type: 'integer' },
                          toQuantity: { type: 'integer' },
                          value: { type: 'string', enum: ['collection','delivery','corporate'] },
                        },
                        required: ['type'],
                      },
                    },
                    handoff: { type: 'boolean' },
                    clarify: { enum: [null, 'product', 'quantity', 'fulfilment'] },
                  },
                  required: ['handled','actions','handoff','clarify'],
                },
              },
            }), TIMEOUTS.aiMs, 'ai_unavailable');
            const structured = result?.response ?? result?.result?.response ?? result;
            const parsed = structured && typeof structured === 'object' && !Array.isArray(structured)
              ? structured
              : parsePlannerJson(typeof structured === 'string' ? structured : '');
            return apiJson(normalizePlannerResult(parsed, payload.question, payload.state));"""
          assert worker.count(old_planner) == 1, 'planner call signature changed; refusing unsafe patch'
          worker = worker.replace(old_planner, new_planner, 1)
          worker_path.write_text(worker)

          info_path = Path('site/build-info.json')
          info = json.loads(info_path.read_text())
          assert info.get('build') == old_build, 'unexpected build-info source build'
          info['build'] = new_build
          info['source'] = 'Lovely Coffee House R17 + R18 Workers AI JSON-schema planner hardening with deterministic server validation and client action execution'
          info['sw_version'] = '2026-09-12-r18-planner-json'
          info['artifact'] = 'release/r18-site.sha256'
          info_path.write_text(json.dumps(info, indent=2, ensure_ascii=False) + '\n')

          sw_path = Path('site/sw.js')
          sw = sw_path.read_text()
          replacements = {
            "2026-09-11-r17-structured-actions": "2026-09-12-r18-planner-json",
            "lovely-static-r17-structured-actions": "lovely-static-r18-planner-json",
            "lovely-nav-r17-structured-actions": "lovely-nav-r18-planner-json",
          }
          for old, new in replacements.items():
            assert old in sw, f'missing service-worker marker: {old}'
            sw = sw.replace(old, new, 1)
          sw_path.write_text(sw)

          report = '''Lovely Coffee House R18 — Planner JSON Hardening\n\nBuild: lovely-live-source-r18-planner-json-mode-20260912-r18\n\nRoot cause isolated in production:\n- Workers AI binding: READY\n- Generic /api/lovely-ai: HTTP 200\n- R17 /api/lovely-actions: HTTP 503\n- Therefore the failure was isolated to structured planner output parsing/normalization rather than Cloudflare authentication or the AI binding.\n\nR18 changes:\n- Uses Cloudflare Workers AI JSON Schema response_format for /api/lovely-actions.\n- Accepts Cloudflare JSON Mode structured response objects directly, while retaining guarded string parsing compatibility.\n- Preserves deterministic catalog, grounding, quantity, fulfilment and handoff validation before any browser cart mutation.\n- Bumps build identity and service-worker cache generation.\n- Retains R17 manifest for rollback.\n'''
          Path('release/R18_PLANNER_JSON_HARDENING_REPORT.txt').write_text(report)
          PY

          # Seal the exact 50-file site tree.
          find site -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  site/#  #' > release/r18-site.sha256
          test "$(wc -l < release/r18-site.sha256)" -eq 50
          (cd site && sha256sum -c ../release/r18-site.sha256)
          node --check site/_worker.js

          BUILD_HASH="$(sha256sum site/build-info.json | awk '{print $1}')"
          SW_HASH="$(sha256sum site/sw.js | awk '{print $1}')"

          python3 - "$BUILD_HASH" "$SW_HASH" <<'PY'
          from pathlib import Path
          import sys
          build_hash, sw_hash = sys.argv[1], sys.argv[2]
          old_build = 'lovely-live-source-r17-structured-action-planner-20260911-r17'
          new_build = 'lovely-live-source-r18-planner-json-mode-20260912-r18'

          deploy_path = Path('.github/workflows/deploy-production.yml')
          deploy = deploy_path.read_text()
          assert old_build in deploy
          deploy = deploy.replace(old_build, new_build)
          deploy = deploy.replace('release/r17-site.sha256', 'release/r18-site.sha256')
          deploy = deploy.replace('f6bad5f1b54780a7d1ac9bb77ddd6215d0431ccc3fe0527f77bf5d630b4ad32a', build_hash)
          deploy = deploy.replace('d10f722ce5171ef4907b5c06798cf641ae40e62db200804ddb6a588984c69f06', sw_hash)
          deploy = deploy.replace('R17', 'R18')
          deploy_path.write_text(deploy)

          verify_old = Path('.github/workflows/verify-r17-source.yml')
          verify = verify_old.read_text()
          verify = verify.replace('R17', 'R18').replace('r17', 'r18').replace(old_build, new_build)
          verify_new = Path('.github/workflows/verify-r18-source.yml')
          verify_new.write_text(verify)
          verify_old.unlink()

          Path('README.md').write_text(f'''# Lovely Coffee House\n\nProduction source repository for [lovelycoffeehouse.com](https://lovelycoffeehouse.com).\n\n## Current production candidate\n\n- Release: **R18 — Planner JSON Hardening**\n- Build: `{new_build}`\n- Cloudflare Pages project: `lovelycoffeehouse`\n- Sealed site manifest: `release/r18-site.sha256` (50 files)\n- Rollback manifest retained: `release/r17-site.sha256`\n- Workers AI binding: `AI`\n\nR18 preserves the R17 deterministic commerce validation layer and hardens the structured action planner with Cloudflare Workers AI JSON-schema output. Production deployment is guarded by exact source checksums, runtime AI checks, planner smoke tests, and custom-domain build verification.\n''')
          PY

          # Remove one-off diagnostic/build machinery from the sealed release commit.
          rm -f .github/workflows/diagnose-r17-ai.yml
          rm -f .github/workflows/build-r18-hotfix.yml

          # Three release gates.
          echo 'PASS 1/3: syntax + exact 50-file checksum validation'
          node --check site/_worker.js
          (cd site && sha256sum -c ../release/r18-site.sha256 >/dev/null)

          echo 'PASS 2/3: release identity + JSON Mode hardening'
          grep -q 'lovely-live-source-r18-planner-json-mode-20260912-r18' site/_worker.js
          grep -q 'lovely-live-source-r18-planner-json-mode-20260912-r18' site/build-info.json
          grep -q "type: 'json_schema'" site/_worker.js
          grep -q "const structured = result?.response" site/_worker.js
          grep -q '2026-09-12-r18-planner-json' site/sw.js

          echo 'PASS 3/3: deployment + integrity workflow consistency'
          grep -q 'release/r18-site.sha256' .github/workflows/deploy-production.yml
          grep -q 'release/r18-site.sha256' .github/workflows/verify-r18-source.yml
          grep -q 'lovely-live-source-r18-planner-json-mode-20260912-r18' .github/workflows/deploy-production.yml
          grep -q 'lovely-live-source-r18-planner-json-mode-20260912-r18' .github/workflows/verify-r18-source.yml

      - name: Commit sealed R18 and trigger guarded production deploy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'adinosassist-stack'
          git config user.email 'adinosassist@gmail.com'
          git add -A
          git diff --cached --check
          git commit -m 'Seal R18 planner JSON hardening and deploy [deploy]'
          git push origin HEAD:main
