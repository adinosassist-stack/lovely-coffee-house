name: Verify rollback artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 3 * * 1'

permissions:
  contents: read

concurrency:
  group: lovely-coffee-house-rollback-integrity
  cancel-in-progress: true

jobs:
  verify-rollbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout R21 immutable rollback
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b50d94ca07e6becc76f098ff76e7e977919a0a07
          path: r21
          fetch-depth: 1

      - name: Checkout R20 immutable rollback
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ab83bf6d794fd044c8e78a65fa32986e5fac4c5a
          path: r20
          fetch-depth: 1

      - name: Verify R21 complete seal
        shell: bash
        run: |
          set -euo pipefail
          cd r21
          [ "$(git rev-parse HEAD)" = 'b50d94ca07e6becc76f098ff76e7e977919a0a07' ]
          [ -f release/r21-site.sha256 ]
          find site -type f -printf '%P\n' | sort > "$RUNNER_TEMP/r21-files.txt"
          awk '{print $2}' release/r21-site.sha256 | sort > "$RUNNER_TEMP/r21-manifest.txt"
          diff -u "$RUNNER_TEMP/r21-manifest.txt" "$RUNNER_TEMP/r21-files.txt"
          (cd site && sha256sum -c ../release/r21-site.sha256)
          node --input-type=module --check < site/_worker.js
          node --input-type=module --check < site/_worker-r20.js
          node --check site/sw.js
          printf '%s  %s\n' '5484286837bc738233aba1fb42a335a43230fde72e7fb486b4455f7496cd76c7' 'site/_worker-r20.js' | sha256sum -c -
          printf '%s  %s\n' 'f2b2428cbf987eca607cb7ed90a703b8f1ef6e7803aa40c63d165fcdba368438' 'site/_worker.js' | sha256sum -c -
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json','utf8'));
          if (info.build !== 'lovely-live-source-r21-ai-quota-efficiency-20260913-r21') throw new Error('R21 build identity mismatch');
          if (info.ai_binding !== 'AI') throw new Error('R21 AI binding metadata mismatch');
          if (info.artifact !== 'release/r21-site.sha256') throw new Error('R21 artifact metadata mismatch');
          if (info.rollback_artifact !== 'release/r20-site.sha256') throw new Error('R21 rollback metadata mismatch');
          NODE
          grep -q 'X-Lovely-Build: lovely-live-source-r21-ai-quota-efficiency-20260913-r21' site/_headers

      - name: Verify R20 complete seal
        shell: bash
        run: |
          set -euo pipefail
          cd r20
          [ "$(git rev-parse HEAD)" = 'ab83bf6d794fd044c8e78a65fa32986e5fac4c5a' ]
          [ -f release/r20-site.sha256 ]
          find site -type f -printf '%P\n' | sort > "$RUNNER_TEMP/r20-files.txt"
          awk '{print $2}' release/r20-site.sha256 | sort > "$RUNNER_TEMP/r20-manifest.txt"
          diff -u "$RUNNER_TEMP/r20-manifest.txt" "$RUNNER_TEMP/r20-files.txt"
          (cd site && sha256sum -c ../release/r20-site.sha256)
          node --input-type=module --check < site/_worker.js
          node --check site/sw.js
          printf '%s  %s\n' '5484286837bc738233aba1fb42a335a43230fde72e7fb486b4455f7496cd76c7' 'site/_worker.js' | sha256sum -c -
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json','utf8'));
          if (info.build !== 'lovely-live-source-r20-header-consistency-20260912-r20') throw new Error('R20 build identity mismatch');
          if (info.ai_binding !== 'AI') throw new Error('R20 AI binding metadata mismatch');
          if (info.artifact !== 'release/r20-site.sha256') throw new Error('R20 artifact metadata mismatch');
          NODE
          grep -q 'X-Lovely-Build: lovely-live-source-r20-header-consistency-20260912-r20' site/_headers

      - name: Verify emergency workflow pins exact rollback SHAs
        shell: bash
        run: |
          set -euo pipefail
          file='r21/.github/workflows/emergency-rollback.yml'
          if [ ! -f "$file" ]; then
            file="$GITHUB_WORKSPACE/current-emergency-rollback.yml"
            curl -fsSL "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_SHA}/.github/workflows/emergency-rollback.yml" -o "$file"
          fi
          grep -q "b50d94ca07e6becc76f098ff76e7e977919a0a07" "$file"
          grep -q "ab83bf6d794fd044c8e78a65fa32986e5fac4c5a" "$file"
          grep -q "ROLLBACK-R21" "$file"
          grep -q "ROLLBACK-R20" "$file"
          grep -q "workflow_dispatch:" "$file"
          ! grep -Eq '^[[:space:]]+push:' "$file"

      - name: Rollback integrity summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Rollback integrity'
            echo '- R21 immutable SHA + full site manifest: checked'
            echo '- R20 immutable SHA + full site manifest: checked'
            echo '- Sealed R20 worker hash: checked in both rollback lines'
            echo '- Build identity and AI binding metadata: checked'
            echo '- Emergency workflow SHA pins + typed confirmations: checked'
            echo '- No production deployment occurs in this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
