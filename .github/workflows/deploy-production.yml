name: Lovely Coffee House Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovely-coffee-house-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PROJECT: lovelycoffeehouse
  CLOUDFLARE_CUSTOM_DOMAIN: lovelycoffeehouse.com
  WRANGLER_VERSION: 4.131.0
  EXPECTED_BUILD: lovely-live-source-r17-structured-action-planner-20260911-r17

jobs:
  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Re-verify sealed R17 source
        shell: bash
        run: |
          set -euo pipefail
          test -d site
          test -f release/r17-site.sha256
          test "$(wc -l < release/r17-site.sha256)" -eq 50
          test "$(find site -type f | wc -l)" -eq 50
          (cd site && sha256sum -c ../release/r17-site.sha256)
          node --check site/_worker.js
          find site/assets -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
          node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json', 'utf8'));
          if (info.build !== process.env.EXPECTED_BUILD) throw new Error(`Unexpected build: ${info.build}`);
          if (info.ai_binding !== 'AI') throw new Error(`Unexpected AI binding: ${info.ai_binding}`);
          if (info.deploymentForm !== 'single-file-worker-direct-upload') throw new Error(`Unexpected deployment form: ${info.deploymentForm}`);
          console.log(`Production candidate verified: ${info.build}`);
          NODE

      - name: Validate Cloudflare credentials and Pages target
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo '::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo '::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID'; exit 1; }

          # Copy/paste from dashboards can add trailing CR/LF or spaces. Normalize only
          # whitespace; never weaken the credential or infer/replace its actual value.
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID

          [ -n "$CLOUDFLARE_API_TOKEN" ] || { echo '::error::Cloudflare API token is empty after whitespace normalization'; exit 1; }
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || { echo '::error::Cloudflare Account ID is empty after whitespace normalization'; exit 1; }
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo '::error::Cloudflare Account ID contains characters other than letters, numbers, hyphens, or underscores. Re-copy only the Account ID value from Cloudflare.'
            exit 1
          fi

          # Persist normalized values for all following steps without logging them.
          {
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID"
          } >> "$GITHUB_ENV"

          node --version
          npx --yes "wrangler@${WRANGLER_VERSION}" --version
          npx --yes "wrangler@${WRANGLER_VERSION}" pages project list --json > "$RUNNER_TEMP/pages-projects.json"

          # Prefer the sealed deploy-kit project name. If it differs in Cloudflare,
          # resolve the one project actually attached to the production custom domain.
          resolved_project="$(PROJECTS_JSON="$(cat "$RUNNER_TEMP/pages-projects.json")" node - <<'NODE'
          const projects = JSON.parse(process.env.PROJECTS_JSON || '[]');
          if (!Array.isArray(projects)) throw new Error('Wrangler did not return a Pages project array');
          const expected = process.env.CLOUDFLARE_PROJECT;
          const domain = process.env.CLOUDFLARE_CUSTOM_DOMAIN;
          if (projects.some(p => p?.name === expected)) {
            process.stdout.write(expected);
            process.exit(0);
          }

          const token = process.env.CLOUDFLARE_API_TOKEN;
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const matches = [];
          for (const project of projects) {
            if (!project?.name) continue;
            const url = `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project.name)}/domains`;
            const response = await fetch(url, { headers: { Authorization: `Bearer ${token}` } });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || payload?.success === false) continue;
            const domains = Array.isArray(payload?.result) ? payload.result : [];
            if (domains.some(entry => String(entry?.name || '').toLowerCase() === domain.toLowerCase())) {
              matches.push(project.name);
            }
          }

          if (matches.length === 1) {
            process.stdout.write(matches[0]);
            process.exit(0);
          }

          const names = projects.map(p => p?.name).filter(Boolean);
          console.error(`Expected Pages project '${expected}' not found and production domain '${domain}' resolved to ${matches.length} matching projects.`);
          console.error(`Accessible Pages projects (${names.length}): ${names.length ? names.join(', ') : '(none)'}`);
          process.exit(1);
          NODE
          )"

          [ -n "$resolved_project" ] || { echo '::error::Could not resolve the Cloudflare Pages production project'; exit 1; }
          CLOUDFLARE_PROJECT="$resolved_project"
          export CLOUDFLARE_PROJECT
          printf 'CLOUDFLARE_PROJECT=%s\n' "$CLOUDFLARE_PROJECT" >> "$GITHUB_ENV"
          echo "Cloudflare Pages target qualified: $CLOUDFLARE_PROJECT"

      - name: Deploy exact R17 source to Cloudflare Pages production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/wrangler-deploy.log"
          # For Pages Direct Upload, omitting --branch targets the project's production environment.
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site \
            --project-name="$CLOUDFLARE_PROJECT" \
            --commit-hash="$GITHUB_SHA" \
            --commit-message="GitHub production ${GITHUB_SHA} ${EXPECTED_BUILD}" 2>&1 | tee "$log"
          deployment_url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$log" | tail -n 1 || true)"
          [ -n "$deployment_url" ] || { echo '::error::Wrangler completed without a parseable Pages deployment URL'; exit 1; }
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "Cloudflare production deployment URL: $deployment_url"

      - name: Verify deployment-specific R17 runtime
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/lovely-production-smoke"
          mkdir -p "$tmp"

          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$DEPLOYMENT_URL/build-info.json" -o "$tmp/build-info.json"
          printf '%s  %s\n' 'f6bad5f1b54780a7d1ac9bb77ddd6215d0431ccc3fe0527f77bf5d630b4ad32a' "$tmp/build-info.json" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$DEPLOYMENT_URL/sw.js" -o "$tmp/sw.js"
          printf '%s  %s\n' 'd10f722ce5171ef4907b5c06798cf641ae40e62db200804ddb6a588984c69f06' "$tmp/sw.js" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 "$DEPLOYMENT_URL/assets/lovely-ai.8f169dbb9daf.js" -o "$tmp/lovely-ai.js"
          printf '%s  %s\n' '8f169dbb9daf4c87badf614108443e71e2dc8732c684540b0a164723c8ff853c' "$tmp/lovely-ai.js" | sha256sum -c -

          status_json=''
          for attempt in 1 2 3; do
            if status_json="$(curl --fail --silent --show-error --retry 2 --retry-delay 2 "$DEPLOYMENT_URL/api/lovely-status")"; then break; fi
            sleep 2
          done
          STATUS_JSON="$status_json" node - <<'NODE'
          const payload = JSON.parse(process.env.STATUS_JSON || '{}');
          if (payload.ai !== true) throw new Error(`Workers AI is not ready: ${JSON.stringify(payload)}`);
          console.log('Workers AI status: ready');
          NODE

          planner_payload='{"question":"add one cappuccino","history":[],"context":"coffee","mode":"text","state":{"order":[],"orderTotal":0,"fulfilment":null,"lastProduct":null,"flow":null,"flowStep":null,"hydrationReminder":null}}'
          planner_json=''
          for attempt in 1 2 3; do
            if planner_json="$(curl --fail --silent --show-error -H "Origin: $DEPLOYMENT_URL" -H 'Content-Type: application/json' -H 'X-Lovely-Client: githubproduction1' --data "$planner_payload" "$DEPLOYMENT_URL/api/lovely-actions")"; then break; fi
            sleep 2
          done
          PLANNER_JSON="$planner_json" node - <<'NODE'
          const payload = JSON.parse(process.env.PLANNER_JSON || '{}');
          if (payload.handled !== true || !Array.isArray(payload.actions) || payload.actions.length < 1 || payload.actions[0]?.type !== 'ADD_ITEM') {
            throw new Error(`Structured action planner smoke test failed: ${JSON.stringify(payload)}`);
          }
          console.log('Structured action planner: ready');
          NODE

      - name: Verify custom production domain R17 assets
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/lovely-custom-domain-smoke"
          mkdir -p "$tmp"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 'https://lovelycoffeehouse.com/robots.txt' -o "$tmp/robots.txt"
          printf '%s  %s\n' '92eac92c256c998178345aa7f99477a2a63223c6091a840607d59e3c98fe3303' "$tmp/robots.txt" | sha256sum -c -
          curl --fail --silent --show-error --location --retry 5 --retry-delay 2 'https://lovelycoffeehouse.com/sw.js' -o "$tmp/sw.js"
          printf '%s  %s\n' 'd10f722ce5171ef4907b5c06798cf641ae40e62db200804ddb6a588984c69f06' "$tmp/sw.js" | sha256sum -c -
          headers="$(curl --fail --silent --show-error --head --retry 5 --retry-delay 2 'https://lovelycoffeehouse.com/robots.txt')"
          printf '%s\n' "$headers" | tr -d '\r' | grep -iF "x-lovely-build: $EXPECTED_BUILD" >/dev/null || {
            echo '::error::Production custom domain did not expose the expected X-Lovely-Build header'
            exit 1
          }

      - name: Production deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo '### Lovely Coffee House production deployment'
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Build: \`$EXPECTED_BUILD\`"
            echo "- Cloudflare project: \`$CLOUDFLARE_PROJECT\`"
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo '- Custom domain: https://lovelycoffeehouse.com'
            echo '- Sealed source: verified'
            echo '- Workers AI: verified'
            echo '- Structured action planner: verified'
            echo '- Custom-domain R17 assets: verified'
          } >> "$GITHUB_STEP_SUMMARY"
