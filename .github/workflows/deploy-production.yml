name: Lovely Coffee House Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovely-coffee-house-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PROJECT: lovelycoffeehouse
  WRANGLER_VERSION: 4.131.0
  EXPECTED_BUILD: lovely-live-source-r20-header-consistency-20260912-r20

jobs:
  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify sealed R20 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < release/r20-site.sha256)" -eq 50
          test "$(find site -type f | wc -l)" -eq 50
          (cd site && sha256sum -c ../release/r20-site.sha256)
          node --check site/_worker.js
          grep -q "response_format: { type: 'json_object' }" site/_worker.js
          ! grep -q "type: 'json_schema'" site/_worker.js
          grep -q "X-Lovely-Build: $EXPECTED_BUILD" site/_headers
          BUILD="$EXPECTED_BUILD" node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json','utf8'));
          if (info.build !== process.env.BUILD) throw new Error(`Unexpected build ${info.build}`);
          if (info.ai_binding !== 'AI') throw new Error('AI binding metadata mismatch');
          NODE

      - name: Qualify exact Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Za-z0-9_-]{32}$ ]] || { echo '::error::Invalid Cloudflare Account ID'; exit 1; }
          body="$RUNNER_TEMP/project.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT")"
          [ "$code" = 200 ] || { cat "$body"; exit 1; }
          PROJECT_JSON="$(cat "$body")" node - <<'NODE'
          const p = JSON.parse(process.env.PROJECT_JSON || '{}');
          if (p.success !== true || p.result?.name !== process.env.CLOUDFLARE_PROJECT) throw new Error('Cloudflare project mismatch');
          NODE
          {
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID"
          } >> "$GITHUB_ENV"

      - name: Preserve Pages config and bind Workers AI
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes "wrangler@${WRANGLER_VERSION}" pages download config "$CLOUDFLARE_PROJECT" --force
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('wrangler.toml')
          t = p.read_text()
          line = 'pages_build_output_dir = "./site"'
          t = re.sub(r'^[ \t]*pages_build_output_dir[ \t]*=.*$', line, t, flags=re.M) if re.search(r'^[ \t]*pages_build_output_dir[ \t]*=.*$', t, flags=re.M) else line + '\n' + t
          def bind(text, table):
              pat = rf'^[ \t]*\[{re.escape(table)}\][ \t]*$'
              if not re.search(pat, text, flags=re.M): return text.rstrip() + f'\n\n[{table}]\nbinding = "AI"\n'
              m = re.search(pat, text, flags=re.M); start = m.end()
              n = re.search(r'^[ \t]*\[[^\]]+\][ \t]*$', text[start:], flags=re.M); end = start + n.start() if n else len(text)
              body = text[start:end]
              body = re.sub(r'^[ \t]*binding[ \t]*=.*$', 'binding = "AI"', body, count=1, flags=re.M) if re.search(r'^[ \t]*binding[ \t]*=.*$', body, flags=re.M) else '\nbinding = "AI"' + body
              return text[:start] + body + text[end:]
          t = bind(t, 'ai')
          if re.search(r'^[ \t]*\[env\.production\][ \t]*$', t, flags=re.M): t = bind(t, 'env.production.ai')
          p.write_text(t)
          PY
          grep -q '^\[ai\]$' wrangler.toml
          if grep -q '^\[env.production\]$' wrangler.toml; then grep -q '^\[env.production.ai\]$' wrangler.toml; fi

      - name: Deploy R20 to Cloudflare Pages production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/deploy.log"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="GitHub production $GITHUB_SHA $EXPECTED_BUILD" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$log" | tail -n1 || true)"
          [ -n "$url" ] || { echo '::error::No Pages deployment URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Verify R20 deployment static runtime
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r20-deployment"; mkdir -p "$tmp"
          fetch() { for i in {1..20}; do curl -fsSL "$1" -o "$2" && return 0; sleep 3; done; return 1; }
          fetch "$DEPLOYMENT_URL/build-info.json" "$tmp/build-info.json"
          printf '%s  %s\n' 'ae7d9b6b18b317f33cf4230ccf74875b2167fb1fc3cf30bc2260d7063459c073' "$tmp/build-info.json" | sha256sum -c -
          fetch "$DEPLOYMENT_URL/sw.js" "$tmp/sw.js"
          printf '%s  %s\n' '4bebf51bb65ef6c6990d68b546506e923336b95a1befe1441276b3d5af025f81' "$tmp/sw.js" | sha256sum -c -

      - name: Verify custom domain R20 end-to-end
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r20-custom"; mkdir -p "$tmp"
          wait_ai() {
            local status=''
            for i in {1..20}; do
              status="$(curl -fsS 'https://lovelycoffeehouse.com/api/lovely-status' 2>/dev/null || true)"
              if STATUS="$status" node -e "const p=JSON.parse(process.env.STATUS||'{}'); process.exit(p.ai===true?0:1)" 2>/dev/null; then return 0; fi
              sleep 3
            done
            echo '::error::Custom-domain Workers AI binding did not become ready'
            return 1
          }
          wait_planner() {
            local body out=''
            body='{"question":"add one cappuccino","history":[],"context":"coffee","mode":"text","state":{"order":[],"orderTotal":0,"fulfilment":null,"lastProduct":null,"flow":null,"flowStep":null,"hydrationReminder":null}}'
            for i in {1..20}; do
              out="$(curl -fsS -H 'Origin: https://lovelycoffeehouse.com' -H 'Content-Type: application/json' -H 'X-Lovely-Client: githubcustomdom1' --data "$body" 'https://lovelycoffeehouse.com/api/lovely-actions' 2>/dev/null || true)"
              if OUT="$out" node -e "const p=JSON.parse(process.env.OUT||'{}'); process.exit(p.handled===true&&p.actions?.[0]?.type==='ADD_ITEM'?0:1)" 2>/dev/null; then return 0; fi
              sleep 3
            done
            echo '::error::Custom-domain Workers AI planner did not become ready'
            return 1
          }
          curl -fsSL --retry 10 --retry-delay 3 'https://lovelycoffeehouse.com/robots.txt' -o "$tmp/robots.txt"
          printf '%s  %s\n' '92eac92c256c998178345aa7f99477a2a63223c6091a840607d59e3c98fe3303' "$tmp/robots.txt" | sha256sum -c -
          curl -fsSL --retry 10 --retry-delay 3 'https://lovelycoffeehouse.com/sw.js' -o "$tmp/sw.js"
          printf '%s  %s\n' '4bebf51bb65ef6c6990d68b546506e923336b95a1befe1441276b3d5af025f81' "$tmp/sw.js" | sha256sum -c -
          wait_ai
          wait_planner
          headers="$(curl -fsSL --dump-header - --output /dev/null --retry 10 --retry-delay 3 "https://lovelycoffeehouse.com/robots.txt?build=$GITHUB_SHA")"
          printf '%s\n' "$headers" | tr -d '\r' | grep -iF "x-lovely-build: $EXPECTED_BUILD" >/dev/null || { echo '::error::Custom-domain build header mismatch'; printf '%s\n' "$headers" | tr -d '\r' | grep -i '^x-lovely-build:' || true; exit 1; }

      - name: Production deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo '### Lovely Coffee House R20 production deployment'
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Build: \`$EXPECTED_BUILD\`"
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo '- Custom domain: https://lovelycoffeehouse.com'
            echo '- Sealed source: verified'
            echo '- Pages static runtime: verified'
            echo '- Workers AI binding + structured planner: verified on production custom domain'
            echo '- Custom-domain hashes and build header: verified'
          } >> "$GITHUB_STEP_SUMMARY"