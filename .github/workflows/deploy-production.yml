name: Lovely Coffee House Production Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lovely-coffee-house-production
  cancel-in-progress: false

env:
  CLOUDFLARE_PROJECT: lovelycoffeehouse
  WRANGLER_VERSION: 4.131.0
  EXPECTED_BUILD: lovely-live-source-r21-ai-quota-efficiency-20260913-r21

jobs:
  deploy-production:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact production candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Verify sealed R21 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -l < release/r21-site.sha256)" -eq 51
          test "$(find site -type f | wc -l)" -eq 51
          (cd site && sha256sum -c ../release/r21-site.sha256)
          node --input-type=module --check < site/_worker.js
          node --input-type=module --check < site/_worker-r20.js
          printf '%s  %s\n' '5484286837bc738233aba1fb42a335a43230fde72e7fb486b4455f7496cd76c7' 'site/_worker-r20.js' | sha256sum -c -
          grep -q "import r20 from './_worker-r20.js'" site/_worker.js
          grep -q "url.pathname === '/api/lovely-actions'" site/_worker.js
          grep -q "envWithoutAi(env)" site/_worker.js
          grep -q "response_format: { type: 'json_object' }" site/_worker-r20.js
          ! grep -q "type: 'json_schema'" site/_worker-r20.js
          grep -q 'function routeStructuredCommerce' site/assets/lovely-ai.8f169dbb9daf.js
          grep -q 'function routeOrderCommand' site/assets/lovely-ai.8f169dbb9daf.js
          grep -q 'LovelyOrderEngine' site/assets/lovely-ai.8f169dbb9daf.js
          grep -q 'if(!res.ok)return null' site/assets/lovely-ai.8f169dbb9daf.js
          grep -q "X-Lovely-Build: $EXPECTED_BUILD" site/_headers
          BUILD="$EXPECTED_BUILD" node - <<'NODE'
          const fs = require('node:fs');
          const info = JSON.parse(fs.readFileSync('site/build-info.json','utf8'));
          if (info.build !== process.env.BUILD) throw new Error(`Unexpected build ${info.build}`);
          if (info.ai_binding !== 'AI') throw new Error('AI binding metadata mismatch');
          if (info.commerce_planner !== 'deterministic-client-fallback-authoritative') throw new Error('R21 commerce planner metadata mismatch');
          if (info.rollback_artifact !== 'release/r20-site.sha256') throw new Error('R20 rollback metadata mismatch');
          NODE

      - name: Qualify exact Cloudflare Pages project
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo '::error::Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo '::error::Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          CLOUDFLARE_API_TOKEN="$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '\r\n')"
          CLOUDFLARE_ACCOUNT_ID="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')"
          export CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID
          [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[A-Za-z0-9_-]{32}$ ]] || { echo '::error::Invalid Cloudflare Account ID'; exit 1; }
          body="$RUNNER_TEMP/project.json"
          code="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$CLOUDFLARE_PROJECT")"
          [ "$code" = 200 ] || { cat "$body"; exit 1; }
          PROJECT_JSON="$(cat "$body")" node - <<'NODE'
          const p = JSON.parse(process.env.PROJECT_JSON || '{}');
          if (p.success !== true || p.result?.name !== process.env.CLOUDFLARE_PROJECT) throw new Error('Cloudflare project mismatch');
          NODE
          {
            printf 'CLOUDFLARE_API_TOKEN=%s\n' "$CLOUDFLARE_API_TOKEN"
            printf 'CLOUDFLARE_ACCOUNT_ID=%s\n' "$CLOUDFLARE_ACCOUNT_ID"
          } >> "$GITHUB_ENV"

      - name: Preserve Pages config and bind Workers AI
        shell: bash
        run: |
          set -euo pipefail
          rm -f wrangler.toml wrangler.json wrangler.jsonc
          npx --yes "wrangler@${WRANGLER_VERSION}" pages download config "$CLOUDFLARE_PROJECT" --force
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('wrangler.toml')
          t = p.read_text()
          line = 'pages_build_output_dir = "./site"'
          t = re.sub(r'^[ \t]*pages_build_output_dir[ \t]*=.*$', line, t, flags=re.M) if re.search(r'^[ \t]*pages_build_output_dir[ \t]*=.*$', t, flags=re.M) else line + '\n' + t
          def bind(text, table):
              pat = rf'^[ \t]*\[{re.escape(table)}\][ \t]*$'
              if not re.search(pat, text, flags=re.M): return text.rstrip() + f'\n\n[{table}]\nbinding = "AI"\n'
              m = re.search(pat, text, flags=re.M); start = m.end()
              n = re.search(r'^[ \t]*\[[^\]]+\][ \t]*$', text[start:], flags=re.M); end = start + n.start() if n else len(text)
              body = text[start:end]
              body = re.sub(r'^[ \t]*binding[ \t]*=.*$', 'binding = "AI"', body, count=1, flags=re.M) if re.search(r'^[ \t]*binding[ \t]*=.*$', body, flags=re.M) else '\nbinding = "AI"' + body
              return text[:start] + body + text[end:]
          t = bind(t, 'ai')
          if re.search(r'^[ \t]*\[env\.production\][ \t]*$', t, flags=re.M): t = bind(t, 'env.production.ai')
          p.write_text(t)
          PY
          grep -q '^\[ai\]$' wrangler.toml
          if grep -q '^\[env.production\]$' wrangler.toml; then grep -q '^\[env.production.ai\]$' wrangler.toml; fi

      - name: Deploy R21 to Cloudflare Pages production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/deploy.log"
          npx --yes "wrangler@${WRANGLER_VERSION}" pages deploy site --project-name="$CLOUDFLARE_PROJECT" --branch=main --commit-hash="$GITHUB_SHA" --commit-message="GitHub production $GITHUB_SHA $EXPECTED_BUILD" 2>&1 | tee "$log"
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' "$log" | tail -n1 || true)"
          [ -n "$url" ] || { echo '::error::No Pages deployment URL'; exit 1; }
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Check Pages deployment URL
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r21-deployment"; mkdir -p "$tmp"
          if curl -fsSL --retry 3 --retry-delay 2 "$DEPLOYMENT_URL/build-info.json" -o "$tmp/build-info.json"; then
            printf '%s  %s\n' 'fd6b9793cb55fc686d656e4c17ad5c102b67924bd1f19e06dc23402150fbae05' "$tmp/build-info.json" | sha256sum -c -
            curl -fsSL --retry 3 --retry-delay 2 "$DEPLOYMENT_URL/sw.js" -o "$tmp/sw.js"
            printf '%s  %s\n' '4bebf51bb65ef6c6990d68b546506e923336b95a1befe1441276b3d5af025f81' "$tmp/sw.js" | sha256sum -c -
          else
            echo "::warning::Unique Pages deployment URL is not serving static files; production certification will rely on the custom domain and exact R21 hashes."
          fi

      - name: Verify custom domain R21 end-to-end
        shell: bash
        run: |
          set -euo pipefail
          tmp="$RUNNER_TEMP/r21-custom"; mkdir -p "$tmp"
          wait_ai_binding() {
            local status=''
            for i in {1..20}; do
              status="$(curl -fsS 'https://lovelycoffeehouse.com/api/lovely-status' 2>/dev/null || true)"
              if STATUS="$status" node -e "const p=JSON.parse(process.env.STATUS||'{}'); process.exit(p.ai===true&&p.runtime==='unchecked'?0:1)" 2>/dev/null; then return 0; fi
              sleep 3
            done
            echo '::error::Custom-domain Workers AI binding/status did not become ready'
            return 1
          }
          verify_deterministic_commerce() {
            local ai_asset body client code out response
            ai_asset="site/assets/lovely-ai.8f169dbb9daf.js"
            grep -q 'function routeStructuredCommerce' "$ai_asset"
            grep -q 'function routeOrderCommand' "$ai_asset"
            grep -q 'LovelyOrderEngine' "$ai_asset"
            grep -q 'if(!res.ok)return null' "$ai_asset"
            client="githubprod${GITHUB_SHA:0:8}a${GITHUB_RUN_ATTEMPT}"
            body='{"question":"add one cappuccino","history":[],"context":"coffee","mode":"text","state":{"order":[],"orderTotal":0,"fulfilment":null,"lastProduct":null,"flow":null,"flowStep":null,"hydrationReminder":null}}'
            response="$RUNNER_TEMP/r21-actions.json"
            code="$(curl -sS -o "$response" -w '%{http_code}' -H 'Origin: https://lovelycoffeehouse.com' -H 'Content-Type: application/json' -H "X-Lovely-Client: $client" --data "$body" 'https://lovelycoffeehouse.com/api/lovely-actions' 2>/dev/null || true)"
            out="$(cat "$response" 2>/dev/null || true)"
            [ "$code" = 503 ] || { echo "::error::R21 transaction endpoint unexpectedly invoked cloud planner (HTTP $code)"; printf '%s\n' "$out"; return 1; }
            OUT="$out" node -e "const p=JSON.parse(process.env.OUT||'{}'); process.exit(p.error==='ai_unavailable'?0:1)" 2>/dev/null || { echo '::error::Unexpected R21 transaction fallback response'; return 1; }
            echo 'R21 deterministic commerce path verified: transaction planning spends zero Workers AI neurons'
          }
          curl -fsSL --retry 10 --retry-delay 3 'https://lovelycoffeehouse.com/build-info.json' -o "$tmp/build-info.json"
          printf '%s  %s\n' 'fd6b9793cb55fc686d656e4c17ad5c102b67924bd1f19e06dc23402150fbae05' "$tmp/build-info.json" | sha256sum -c -
          curl -fsSL --retry 10 --retry-delay 3 'https://lovelycoffeehouse.com/robots.txt' -o "$tmp/robots.txt"
          printf '%s  %s\n' '92eac92c256c998178345aa7f99477a2a63223c6091a840607d59e3c98fe3303' "$tmp/robots.txt" | sha256sum -c -
          curl -fsSL --retry 10 --retry-delay 3 'https://lovelycoffeehouse.com/sw.js' -o "$tmp/sw.js"
          printf '%s  %s\n' '4bebf51bb65ef6c6990d68b546506e923336b95a1befe1441276b3d5af025f81' "$tmp/sw.js" | sha256sum -c -
          wait_ai_binding
          verify_deterministic_commerce
          private_code="$(curl -sS -o /dev/null -w '%{http_code}' 'https://lovelycoffeehouse.com/_worker-r20.js')"
          [ "$private_code" = 404 ] || { echo "::error::Private R20 worker module is publicly reachable (HTTP $private_code)"; exit 1; }
          headers="$(curl -fsSL --dump-header - --output /dev/null --retry 10 --retry-delay 3 "https://lovelycoffeehouse.com/robots.txt?build=$GITHUB_SHA")"
          printf '%s\n' "$headers" | tr -d '\r' | grep -iF "x-lovely-build: $EXPECTED_BUILD" >/dev/null || { echo '::error::Custom-domain build header mismatch'; printf '%s\n' "$headers" | tr -d '\r' | grep -i '^x-lovely-build:' || true; exit 1; }

      - name: Production deployment summary
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo '### Lovely Coffee House R21 production deployment'
            echo "- Git SHA: \`$GITHUB_SHA\`"
            echo "- Build: \`$EXPECTED_BUILD\`"
            echo "- Deployment URL: $DEPLOYMENT_URL"
            echo '- Custom domain: https://lovelycoffeehouse.com'
            echo '- Sealed source: verified (51 files)'
            echo '- R20 rollback worker: byte-for-byte verified'
            echo '- Custom-domain static hashes: verified'
            echo '- Workers AI binding/status: verified'
            echo '- Transaction planner: deterministic client fallback authoritative; zero Workers AI neurons'
            echo '- AI/STT/TTS circuit breaker: enabled'
            echo '- Private rollback module: not publicly reachable'
            echo '- Custom-domain build header: verified'
          } >> "$GITHUB_STEP_SUMMARY"
