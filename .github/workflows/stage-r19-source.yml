name: Stage sealed R19 source

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stage-r19:
    if: contains(github.event.head_commit.message, '[stage-r19]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Build, verify and stage R19 runtime
        shell: bash
        env:
          RELEASE_BRANCH: release/r19-json-object-planner-20260912
        run: |
          set -euo pipefail
          git checkout -B "$RELEASE_BRANCH" origin/main

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          old_build = 'lovely-live-source-r18-planner-json-mode-20260912-r18'
          new_build = 'lovely-live-source-r19-json-object-planner-20260912-r19'

          worker_path = Path('site/_worker.js')
          worker = worker_path.read_text()
          assert worker.count(old_build) == 1, 'unexpected R18 build-id count'
          worker = worker.replace(old_build, new_build, 1)
          worker = worker.replace('// Lovely Coffee House R18 - deployment-safe single-file Cloudflare Pages Worker',
                                  '// Lovely Coffee House R19 - deployment-safe single-file Cloudflare Pages Worker', 1)

          pattern = re.compile(r"""const result = await withTimeout\(env\.AI\.run\(AI_MODEL, \{\n\s*messages,\n\s*max_tokens:420,\n\s*temperature:0,\n\s*response_format: \{\n\s*type: 'json_schema',[\s\S]*?\n\s*\},\n\s*\}\), TIMEOUTS\.aiMs, 'ai_unavailable'\);""")
          replacement = (
              "const result = await withTimeout(env.AI.run(AI_MODEL, {\n"
              "    messages,\n"
              "    max_tokens:420,\n"
              "    temperature:0,\n"
              "    response_format: { type: 'json_object' },\n"
              "  }), TIMEOUTS.aiMs, 'ai_unavailable');"
          )
          worker, count = pattern.subn(replacement, worker, count=1)
          assert count == 1, f'expected one strict JSON-schema planner call, got {count}'
          assert "type: 'json_schema'" not in worker, 'strict planner schema still present'
          assert "response_format: { type: 'json_object' }" in worker, 'json_object planner mode missing'
          worker_path.write_text(worker)

          info_path = Path('site/build-info.json')
          info = json.loads(info_path.read_text())
          assert info.get('build') == old_build
          info['build'] = new_build
          info['source'] = 'Lovely Coffee House R18 + R19 Workers AI JSON-object planner compatibility hardening with deterministic server validation and client action execution'
          info['sw_version'] = '2026-09-12-r19-json-object'
          info['artifact'] = 'release/r19-site.sha256'
          info_path.write_text(json.dumps(info, indent=2, ensure_ascii=False) + '\n')

          sw_path = Path('site/sw.js')
          sw = sw_path.read_text()
          for old, new in {
              '2026-09-12-r18-planner-json': '2026-09-12-r19-json-object',
              'lovely-static-r18-planner-json': 'lovely-static-r19-json-object',
              'lovely-nav-r18-planner-json': 'lovely-nav-r19-json-object',
          }.items():
              assert old in sw, f'missing service worker marker {old}'
              sw = sw.replace(old, new, 1)
          sw_path.write_text(sw)

          report = '''Lovely Coffee House R19 — JSON Object Planner Compatibility Hardening\n\nBuild: lovely-live-source-r19-json-object-planner-20260912-r19\n\nProduction evidence from R18:\n- Exact R18 static hashes: PASS\n- Workers AI binding/status: READY\n- Generic Workers AI route: operational\n- Strict JSON-schema /api/lovely-actions call: HTTP 503\n\nRoot-cause direction:\nCloudflare documents that JSON Schema mode can fail when the model cannot satisfy a requested schema. R18 used a deeply nested action schema with optional action-specific properties.\n\nR19 change:\n- Replaces only the planner's strict json_schema response_format with json_object mode.\n- Keeps the existing prompt requiring the exact planner envelope and exact catalog product names.\n- Keeps deterministic server-side normalization, catalog resolution, grounding, quantity validation, fulfilment validation and handoff checks before any browser mutation.\n- Keeps the browser deterministic action executor as the final mutation authority.\n- Bumps build and service-worker cache generation.\n- Retains R18 and R17 manifests for rollback.\n'''
          Path('release/R19_JSON_OBJECT_PLANNER_REPORT.txt').write_text(report)

          Path('README.md').write_text(f'''# Lovely Coffee House\n\nProduction source repository for [lovelycoffeehouse.com](https://lovelycoffeehouse.com).\n\n## Current production candidate\n\n- Release: **R19 — JSON Object Planner Compatibility Hardening**\n- Build: `{new_build}`\n- Cloudflare Pages project: `lovelycoffeehouse`\n- Sealed site manifest: `release/r19-site.sha256` (50 files)\n- Rollback manifests retained: `release/r18-site.sha256`, `release/r17-site.sha256`\n- Workers AI binding: `AI`\n\nR19 preserves the deterministic commerce validation and action-execution layers, while using Cloudflare Workers AI JSON Object mode for the planner instead of the stricter nested JSON Schema request that failed in production.\n''')
          PY

          find site -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  site/#  #' > release/r19-site.sha256
          test "$(wc -l < release/r19-site.sha256)" -eq 50
          test "$(find site -type f | wc -l)" -eq 50
          (cd site && sha256sum -c ../release/r19-site.sha256)
          node --check site/_worker.js
          grep -q "response_format: { type: 'json_object' }" site/_worker.js
          ! grep -q "type: 'json_schema'" site/_worker.js
          grep -q 'lovely-live-source-r19-json-object-planner-20260912-r19' site/_worker.js
          grep -q 'lovely-live-source-r19-json-object-planner-20260912-r19' site/build-info.json

          {
            printf 'BUILD_INFO_SHA256=%s\n' "$(sha256sum site/build-info.json | awk '{print $1}')"
            printf 'SW_SHA256=%s\n' "$(sha256sum site/sw.js | awk '{print $1}')"
            printf 'WORKER_SHA256=%s\n' "$(sha256sum site/_worker.js | awk '{print $1}')"
          } > release/R19_RUNTIME_HASHES.txt

          git config user.name 'adinosassist-stack'
          git config user.email 'adinosassist@gmail.com'
          git add site/_worker.js site/build-info.json site/sw.js release/r19-site.sha256 release/R19_JSON_OBJECT_PLANNER_REPORT.txt release/R19_RUNTIME_HASHES.txt README.md
          git diff --cached --check
          git commit -m 'Stage sealed R19 JSON object planner runtime'
          git push --force-with-lease origin HEAD:"$RELEASE_BRANCH"
